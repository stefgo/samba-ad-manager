# Builds and publishes the container image. Nothing is tagged until the image
# has been started and answered its health check. It creates no version
# number -- that is release.yml alone, on request.
name: Build Images

on:
    push:
        # Both long-lived branches publish a rolling image: :main is the state
        # released to everyone, :dev the one for developers. Neither creates a
        # version. type=ref,event=branch below already yields the branch name as tag.
        branches: ["main", "dev"]
        # A release tag reaches this workflow through the workflow_dispatch that
        # release.yml fires -- semantic-release pushes the tag over GITHUB_TOKEN, and
        # such a push creates no workflow run. The filter covers a tag pushed by hand.
        tags: ["v*.*.*"]
        # A commit that only touches documentation changes nothing inside the
        # image, so it need not rebuild it. Path filters apply to branch
        # pushes only -- neither a tag nor workflow_dispatch is affected.
        paths-ignore:
            - "docs/**"
            - "mkdocs.yml"
            - "requirements-docs.txt"
            - ".github/workflows/docs.yml"
            - "**.md"
    workflow_dispatch: # Allows manual trigger in the Actions tab, for any branch

# A second push to the same branch makes the older build pointless. Tag builds are
# never cancelled -- their image is the artefact of a release.
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# The registry is named once, here. The image name cannot join it: an `env` entry
# cannot reference another entry of the same block, and a job's `env` cannot read
# the `env` context at all -- only a step can. `prepare` therefore composes the
# name in a `run:` step, and the jobs below take it from `needs`, which a job's
# `env` does accept.
env:
    REGISTRY: ghcr.io

jobs:
    # Typecheck and lint before anything is built. Reuses ci.yml rather than
    # restating the steps, so the gate cannot drift from the branch checks.
    verify:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            packages: read

    # The single source of the version string and of the image name.
    prepare:
        needs: verify
        runs-on: ubuntu-latest
        # Computes strings from GITHUB_REF and GITHUB_SHA -- no checkout, no
        # registry, no API. Stated rather than left to the repository default.
        permissions: {}
        outputs:
            version: ${{ steps.version.outputs.version }}
            image: ${{ steps.version.outputs.image }}
        steps:
            - name: Determine Version
              id: version
              run: |
                  echo "image=$REGISTRY/${{ github.repository_owner }}/sadm-server" >> "$GITHUB_OUTPUT"
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    # Tag name without the leading v, so the string baked into the
                    # image matches the Docker tag (1.2.0) and the root package.json.
                    echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
                  else
                    echo "version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
                  fi

    # The image ships as a real multi-arch manifest. Each architecture is built on a
    # native runner and pushed **by digest and without a tag** -- tagging is the
    # publish job's business, and that one runs after the smoke test.
    build:
        needs: prepare
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                      platform: linux/amd64
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      platform: linux/arm64

        env:
            IMAGE: ${{ needs.prepare.outputs.image }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Tags are attached by the publish job; here only the labels are needed.
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./docker/Dockerfile.server
                  platforms: ${{ matrix.platform }}
                  build-args: |
                      APP_VERSION=${{ needs.prepare.outputs.version }}
                  # GitHub Packages refuses anonymous reads even of a public package.
                  # GITHUB_TOKEN is enough to read it and, unlike a personal access
                  # token, never expires.
                  secrets: |
                      npm_token=${{ secrets.GITHUB_TOKEN }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # One cache per architecture, or the two jobs would overwrite each
                  # other's layers.
                  cache-from: type=gha,scope=server-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

            # The file name is the digest; the file itself stays empty. It is the
            # cheapest way to hand a string from a matrix job to a later job --
            # matrix jobs cannot each set an output of their own.
            - name: Export digest
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  mkdir -p /tmp/digests
                  touch "/tmp/digests/${DIGEST#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ matrix.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # Starts what was just built and asks it whether it is alive. The only place in the
    # pipeline where the image is executed -- everything before proves that the code
    # compiles, not that the result starts.
    #
    # It is a gate, not a report: nothing is tagged until it has passed, so `latest`
    # cannot come to mean an image that never started. Both architectures run
    # natively, each against exactly the digest this run produced for it.
    smoke:
        name: Smoke test
        needs: [prepare, build]
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: read

        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                    - arch: arm64
                      runner: ubuntu-24.04-arm

        env:
            IMAGE: ${{ needs.prepare.outputs.image }}

        steps:
            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # There is no tag to pull yet, so the image is addressed by digest --
            # more precise anyway: nothing is left for docker to choose.
            - name: Download the digest for this architecture
              uses: actions/download-artifact@v8
              with:
                  name: digests-${{ matrix.arch }}
                  path: /tmp/digests

            - name: Resolve the digest
              run: echo "IMAGE_REF=$IMAGE@sha256:$(basename /tmp/digests/*)" >> "$GITHUB_ENV"

            # A fresh server without config.yaml generates its secret and starts. No domain
            # is configured on the runner: it serves the dashboard and measures nothing --
            # the state of a fresh installation.
            - name: Start the image
              run: docker run -d --name sadm-smoke-server -p 3020:3020 "$IMAGE_REF"

            - name: Wait for it to report healthy
              run: |
                  # probe <container> <command...>: runs the command until its output
                  # carries "status":"ok".
                  probe() {
                    local name=$1; shift
                    for i in $(seq 1 60); do
                      if "$@" 2>/dev/null | grep -q '"status":"ok"'; then
                        echo "$name answered after ${i}s"
                        return 0
                      fi
                      # A container that already exited will never answer.
                      if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
                        echo "::error::$name is no longer running"
                        return 1
                      fi
                      sleep 1
                    done
                    echo "::error::$name did not become healthy within 60s"
                    return 1
                  }
                  probe sadm-smoke-server curl -fsS http://127.0.0.1:3020/api/health

            - name: Container logs
              if: failure()
              run: |
                  docker logs sadm-smoke-server 2>&1 | tail -50

            - name: Clean up
              if: always()
              run: docker rm -f sadm-smoke-server 2>/dev/null || true

    # Nothing above carries a tag: every job so far pushed by digest only. This is where
    # a build becomes something a user can pull, and it runs **after** the smoke test.
    #
    # A build that fails the smoke test leaves its digests in the registry untagged; the
    # nightly Prune Registry run sweeps them through delete-untagged.
    publish:
        name: Tag and publish
        needs: [prepare, build, smoke]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        env:
            IMAGE: ${{ needs.prepare.outputs.image }}

        steps:
            # Both architectures into one directory: every file name is a digest of the image.
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      # For a push to main or dev: the branch name plus the SHA
                      type=ref,event=branch
                      type=sha,prefix=sha-

                      # For a release tag (v1.2.0): the version tags
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      # Only a stable release moves latest. A tag with a hyphen
                      # (v1.2.0-rc.1) is a prerelease and must not reach every host
                      # that pulls latest.
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

            - name: Apply the tags
              run: |
                  # The per-architecture digests become one multi-arch manifest list
                  # under every tag that was computed.
                  mapfile -t args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                  if [ "${#args[@]}" -eq 0 ]; then
                      echo "::error::no tags were computed for $IMAGE"
                      exit 1
                  fi
                  for digest in $(basename -a /tmp/digests/*); do args+=("$IMAGE@sha256:$digest"); done
                  echo "$IMAGE <- ${args[*]}"
                  docker buildx imagetools create "${args[@]}"

            - name: Inspect the published image
              env:
                  VERSION: ${{ steps.meta.outputs.version }}
              run: docker buildx imagetools inspect "$IMAGE:$VERSION"
