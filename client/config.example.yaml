# Samba AD Manager - Client Configuration
#
# This file holds what you set. What the server issues at registration -- this agent's client
# id and its auth token -- is not in here: it lives in identity.json in the agent's data
# directory (SADM_CLIENT_DATA_DIR, a named volume in compose.yaml). Lose that directory and
# the agent has to be registered again.
#
# Checked on every start: a value of the wrong type or format stops the agent with a log line
# naming the field. The agent writes back to this file in one case only -- the serverUrl of a
# registration made through the web UI.

# Log level for the client (trace, debug, info, warn, error, fatal, silent). Not set, or not
# one of these (ignored with a warning), the LOG_LEVEL environment variable applies, and
# without it "info".
logLevel: "info"

# URL of the SADM Server (e.g., http://your-server:3020). Set it here and the register page
# is filled in for you; leave it empty and a registration through that page writes it back.
# An agent the server dials instead (outbound mode) has no serverUrl at all: the server
# registers it with the setup PIN from this agent's log, entered in its Add Client wizard.
# For an unattended rollout, SADM_REGISTRATION_SECRET (or SADM_REGISTRATION_SECRET_FILE)
# sets a secret the wizard accepts in place of the PIN. It is not read from this file.
serverUrl:

# The Samba container this agent stands next to. Its state comes from the Docker API; the
# replication neighbours, the service processes and the database check are read inside it,
# by a small Python script on Samba's own modules. That takes the Docker socket (see
# compose.yaml) -- which is root on this host. Without a container name none of this is
# read and the socket is never opened.
samba:
    # Name or id of the container, as `docker ps` shows it. Override with SADM_SAMBA_CONTAINER.
    container:
    # Override with SADM_DOCKER_SOCKET.
    dockerSocket: /var/run/docker.sock
    # The interpreter inside the container that can import Samba's modules.
    python: python3

# The directory of this domain controller, over LDAPS. Read for who the domain controller is,
# how it sees its domain (FSMO roles, the other domain controllers) and for the directory
# objects themselves.
#
# The password of bindDn is NOT set here: give it as SADM_LDAP_PASSWORD, or name a file that
# holds it with SADM_LDAP_PASSWORD_FILE (a Docker secret). Without bindDn and password the
# agent reads only what the directory tells anyone: its name, version and state.
ldap:
    # ldaps://<host>[:port], e.g. ldaps://dc1.example.net. Override with SADM_LDAP_URL.
    url:
    # A DN or user@realm. Override with SADM_LDAP_BIND_DN.
    bindDn:
    # PEM file with the CA -- or the certificate itself -- the domain controller presents.
    # Samba generates a self-signed one at /var/lib/samba/private/tls/ca.pem.
    # Override with SADM_LDAP_CA_FILE.
    caFile:
    # Accept a certificate that cannot be verified (default: false). The connection carries
    # the bind password and every password this agent sets. Override with
    # SADM_LDAP_ALLOW_SELF_SIGNED=true.
    allowSelfSigned: false
    # Milliseconds to wait for the directory (default: 15000).
    timeoutMs: 15000

# What the server may do with the directory through this agent. Decided here, on the domain
# controller's side: whoever takes over the server cannot switch it back on.
directory:
    # false: the agent measures its domain controller and answers nothing about objects.
    enabled: true
    # true: users, groups, computers and OUs can be looked at, and none is changed.
    readOnly: false

# How often the domain controller is measured.
health:
    # Seconds between two measurements (default: 60).
    interval: 60
    # Seconds between two readings of replication and of the object counts (default: 300).
    replicationInterval: 300
    # Hours between two database checks (default: 24). 0: only when asked from the dashboard.
    dbcheckIntervalHours: 24

# Accept a server certificate that does not validate (e.g. self-signed) for registration and
# for the WebSocket connection. Leave false when the server has a certificate from a trusted
# CA: the connection carries this agent's auth token, and an unchecked certificate is one
# anybody in between can present. The reachability check on the web UI tolerates it anyway.
allowSelfSignedCertificates: false

# IPv4 addresses or CIDR networks the server may dial this agent from, checked on
# /ws/register and /ws/agent. Empty (the default) allows every address.
# It matters most for /ws/register, where the caller hands over the auth token this agent
# stores. The address checked is the socket peer: behind a reverse proxy list the proxy.
# The local web UI on the same port is not restricted by this.
# A wrong value can only be fixed on this host -- the connection you would use is refused.
allowedNetworks: []

# Port the local web server listens on: the status and register pages, and the two routes
# the server uses to dial this agent in outbound mode (default: 3021).
# Override with the SADM_CLIENT_PORT environment variable, which wins over this file — in a
# container that saves mounting a config file just to move the port.
# Worth changing when port 3021 is already taken on the host, or with network_mode: host,
# where the compose `ports:` mapping no longer applies.
# An unusable value ends the start instead of falling back: an agent listening somewhere
# other than where you put it is the harder fault to find.
listenPort: 3021

# Serve this agent's web server over TLS instead of plain HTTP (default: off).
# Only then can the server dial it as wss://host:port, which is what keeps the auth token in
# the /ws/agent query string off the wire in the clear. Without this block nothing changes.
# Both files must be readable at startup; if either is not, the agent stops and says which.
# It does not fall back to HTTP -- an agent that was configured for TLS and quietly served
# plaintext would hand out its auth token on /ws/register while looking perfectly healthy.
# Relative paths are resolved against the agent's directory.
# A reverse proxy terminating TLS in front of the agent works too; leave this unset then and
# point the proxy at the plain port.
# tls:
#     cert: /etc/sadm/agent.crt
#     key: /etc/sadm/agent.key

# Show the status page at /status (default: true)
enableStatusPage: true

# Show the registration page at /register and accept POST /api/register (default: true)
# Registering requires the setup PIN printed to the agent's log on startup.
# The page closes by itself once the client is registered. Disable it for a client that
# should only ever be registered by the server (outbound mode).
enableRegisterPage: true
