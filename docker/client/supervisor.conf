; The SADM agent as a program of the supervisord that runs Samba. Link or copy this file into
; the directory supervisord includes (`[include] files = /etc/supervisor/conf.d/*.conf`).
;
; After Samba (priority), and started again whenever it ends: the agent must never be the
; reason a domain controller stops, and a domain controller without it keeps running.
[program:sadm-client]
command=/opt/sadm-client/bin/sadm-client
priority=10
startsecs=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
