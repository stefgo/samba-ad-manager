<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Three of the triangles a domain is drawn as in Active Directory diagrams, put
         together into one: the forest. The plate is the dashboard's accent
         (ruic-primary, #c22fd6) between a lighter shade and its hover shade. -->
    <defs>
        <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D24AE6" />
            <stop offset="100%" stop-color="#A41FB5" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="100" height="100" rx="25" ry="25" fill="url(#plate)" />
    <g transform="translate(14, 13) scale(3)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5 16.5 10.5H7.5Z" />
        <path d="M6.5 12.5 11 20.5H2Z" />
        <path d="M17.5 12.5 22 20.5H13Z" />
    </g>
</svg>
