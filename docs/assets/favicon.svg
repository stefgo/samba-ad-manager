<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- The triangle a domain is drawn as in Active Directory diagrams, and inside it a
         small directory tree. The plate is the dashboard's accent (ruic-primary, #c22fd6)
         between a lighter shade and its hover shade. -->
    <defs>
        <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D24AE6" />
            <stop offset="100%" stop-color="#A41FB5" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="100" height="100" rx="25" ry="25" fill="url(#plate)" />
    <g transform="translate(14, 13) scale(3)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
        <path stroke-width="2" d="M12 2.5 22 20.5H2Z" />
        <path stroke-width="1.5" d="M12 10v3M8 16.5V15a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5" />
        <g fill="#ffffff" stroke="none">
            <circle cx="12" cy="9.5" r="1.6" />
            <circle cx="8" cy="16.5" r="1.6" />
            <circle cx="16" cy="16.5" r="1.6" />
        </g>
    </g>
</svg>
